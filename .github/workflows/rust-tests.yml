name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Run tests
        working-directory: core
        run: cargo test --all-features

  header-drift:
    name: header drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build (regenerates the header)
        working-directory: core
        run: cargo build

      - name: Check generated header matches committed header
        run: git diff --exit-code -- artifacts/include/msutils.h wrappers/js/src/include/msutils.h wrappers/js/native/include/msutils.h wrappers/r/src/include/msutils.h
