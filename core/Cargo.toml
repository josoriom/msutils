[package]
name = "msutils"
version = "0.1.0"
edition = "2024"

[lib]
name = "msutils"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = false
strip = "symbols"

[dependencies]
bytemuck = "1.25.0"
bytes = "1.5"
ionic = { git = "https://github.com/josoriom/ionic", branch = "ab3", version = "0.1.0" }
memmap2 = "0.9.10"
pollster = "0.4.0"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1.0"
wgpu = "29.0.3"

[target.'cfg(not(all(target_arch = "wasm32", not(target_os = "wasi"))))'.dependencies]
rayon = "1.12.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[build-dependencies]
cbindgen = "0.27"
