[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msutils"
version = "0.1.0"
description = "MSutils library"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["msutils*"]

[tool.setuptools.package-data]
msutils = ["native/**/*"]
